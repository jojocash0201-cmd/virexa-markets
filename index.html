<script>
/* =========================================
   VIREXA MARKETS — CLIENT SYSTEM
   BACKEND CONNECTED DEVELOPMENT VERSION
   ========================================= */

const API_BASE = "https://virexa-markets-backend.onrender.com";


/* =========================================
   API HELPER
   ========================================= */

async function apiRequest(endpoint, options = {}) {

  const response = await fetch(
    API_BASE + endpoint,
    {
      ...options,
      credentials: "include",
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    }
  );

  let data = {};

  try {
    data = await response.json();
  } catch (error) {
    data = {};
  }

  if (!response.ok) {

    throw new Error(
      data.message ||
      data.error ||
      "Something went wrong. Please try again."
    );

  }

  return data;
}


/* =========================================
   MODALS
   ========================================= */

function openM(type) {

  const modal = document.getElementById(type);

  if (!modal) {
    console.error("Modal not found:", type);
    return;
  }

  modal.classList.add("show");
}


function closeM(type) {

  if (type) {

    const modal = document.getElementById(type);

    if (modal) {
      modal.classList.remove("show");
    }

    return;
  }

  const login = document.getElementById("login");
  const signup = document.getElementById("signup");

  if (login) {
    login.classList.remove("show");
  }

  if (signup) {
    signup.classList.remove("show");
  }
}


/* =========================================
   FORM MESSAGES
   ========================================= */

function showMessage(id, message, type) {

  const element = document.getElementById(id);

  if (!element) {
    console.log(message);
    return;
  }

  element.textContent = message;

  element.className =
    "formMessage " + (type || "");
}


/* =========================================
   DASHBOARD
   ========================================= */

function showDashboard(user) {

  const publicSite =
    document.getElementById("publicSite");

  const siteHeader =
    document.getElementById("siteHeader");

  const siteFooter =
    document.getElementById("siteFooter");

  const dashboard =
    document.getElementById("clientDashboard");


  if (publicSite) {
    publicSite.style.display = "none";
  }

  if (siteHeader) {
    siteHeader.style.display = "none";
  }

  if (siteFooter) {
    siteFooter.style.display = "none";
  }

  if (dashboard) {
    dashboard.style.display = "block";
  }


  /* NAME */

  const dashName =
    document.getElementById("dashName");

  if (dashName) {
    dashName.textContent =
      user.name || "Client";
  }


  /* EMAIL */

  const dashEmail =
    document.getElementById("dashEmail");

  if (dashEmail) {
    dashEmail.textContent =
      user.email || "—";
  }


  /* CLIENT ID */

  const dashId =
    document.getElementById("dashId");

  if (dashId) {
    dashId.textContent =
      user.id || "VX-000000";
  }


  /* BALANCE */

  const dashBalance =
    document.getElementById("dashBalance");

  if (dashBalance) {

    dashBalance.textContent =
      "$" +
      Number(user.balance || 0).toFixed(2);

  }


  /* EQUITY */

  const dashEquity =
    document.getElementById("dashEquity");

  if (dashEquity) {

    dashEquity.textContent =
      "$" +
      Number(user.equity || 0).toFixed(2);

  }


  /* ACCOUNT CREATED */

  const dashCreated =
    document.getElementById("dashCreated");

  if (dashCreated) {

    if (user.createdAt) {

      const date =
        new Date(user.createdAt);

      if (!isNaN(date.getTime())) {

        dashCreated.textContent =
          date.toLocaleDateString();

      } else {

        dashCreated.textContent = "—";

      }

    } else {

      dashCreated.textContent = "—";

    }

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================
   RETURN TO WEBSITE
   ========================================= */

function returnToWebsite() {

  const publicSite =
    document.getElementById("publicSite");

  const siteHeader =
    document.getElementById("siteHeader");

  const siteFooter =
    document.getElementById("siteFooter");

  const dashboard =
    document.getElementById("clientDashboard");


  if (dashboard) {
    dashboard.style.display = "none";
  }

  if (publicSite) {
    publicSite.style.display = "block";
  }

  if (siteHeader) {
    siteHeader.style.display = "block";
  }

  if (siteFooter) {
    siteFooter.style.display = "block";
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================
   LOGOUT
   ========================================= */

async function logout() {

  try {

    await apiRequest(
      "/api/logout",
      {
        method: "POST"
      }
    );

  } catch (error) {

    console.error(
      "Logout error:",
      error
    );

  }

  returnToWebsite();
}


/* =========================================
   SECURITY
   ========================================= */

function showSecurity() {

  alert(
    "Virexa Markets authentication is connected to the development backend. Secure server-side authentication is being used for client sessions."
  );

}


/* =========================================
   SIGNUP
   ========================================= */

async function handleSignup(event) {

  event.preventDefault();


  const nameElement =
    document.getElementById("signupName");

  const emailElement =
    document.getElementById("signupEmail");

  const passwordElement =
    document.getElementById("signupPassword");

  const confirmElement =
    document.getElementById("signupConfirm");


  if (
    !nameElement ||
    !emailElement ||
    !passwordElement
  ) {

    console.error(
      "Signup form fields are missing."
    );

    showMessage(
      "signupMessage",
      "Signup form could not be loaded correctly.",
      "error"
    );

    return;
  }


  const name =
    nameElement.value.trim();

  const email =
    emailElement.value
      .trim()
      .toLowerCase();

  const password =
    passwordElement.value;

  const confirm =
    confirmElement
      ? confirmElement.value
      : password;


  /* VALIDATION */

  if (name.length < 2) {

    showMessage(
      "signupMessage",
      "Please enter your full name.",
      "error"
    );

    return;
  }


  if (!email || !email.includes("@")) {

    showMessage(
      "signupMessage",
      "Please enter a valid email address.",
      "error"
    );

    return;
  }


  if (password.length < 10) {

    showMessage(
      "signupMessage",
      "Password must contain at least 10 characters.",
      "error"
    );

    return;
  }


  if (password !== confirm) {

    showMessage(
      "signupMessage",
      "Passwords do not match.",
      "error"
    );

    return;
  }


  showMessage(
    "signupMessage",
    "Creating your Virexa account...",
    "success"
  );


  try {

    /* SEND ACCOUNT TO BACKEND */

    const data =
      await apiRequest(
        "/api/register",
        {
          method: "POST",

          body: JSON.stringify({
            name: name,
            email: email,
            password: password
          })
        }
      );


    const user =
      data.user || data;


    showMessage(
      "signupMessage",
      "Account created successfully!",
      "success"
    );


    setTimeout(
      function() {

        closeM("signup");

        showDashboard(user);

      },
      500
    );


  } catch (error) {

    console.error(
      "Signup error:",
      error
    );


    showMessage(
      "signupMessage",
      error.message ||
      "Unable to create your account.",
      "error"
    );

  }

}


/* =========================================
   LOGIN
   ========================================= */

async function handleLogin(event) {

  event.preventDefault();


  const emailElement =
    document.getElementById("loginEmail");

  const passwordElement =
    document.getElementById("loginPassword");


  if (
    !emailElement ||
    !passwordElement
  ) {

    showMessage(
      "loginMessage",
      "Login form could not be loaded correctly.",
      "error"
    );

    return;
  }


  const email =
    emailElement.value
      .trim()
      .toLowerCase();

  const password =
    passwordElement.value;


  if (!email) {

    showMessage(
      "loginMessage",
      "Please enter your email address.",
      "error"
    );

    return;
  }


  if (!password) {

    showMessage(
      "loginMessage",
      "Please enter your password.",
      "error"
    );

    return;
  }


  showMessage(
    "loginMessage",
    "Signing you in...",
    "success"
  );


  try {

    /* LOGIN THROUGH BACKEND */

    const data =
      await apiRequest(
        "/api/login",
        {
          method: "POST",

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );


    const user =
      data.user || data;


    showMessage(
      "loginMessage",
      "Login successful!",
      "success"
    );


    /* GET COMPLETE USER PROFILE */

    try {

      const profile =
        await apiRequest("/api/me");

      if (profile && profile.user) {
        showDashboard(profile.user);
      } else {
        showDashboard(user);
      }

    } catch (profileError) {

      console.warn(
        "Could not load complete profile:",
        profileError
      );

      showDashboard(user);

    }


    setTimeout(
      function() {

        closeM("login");

      },
      300
    );


  } catch (error) {

    console.error(
      "Login error:",
      error
    );


    showMessage(
      "loginMessage",
      error.message ||
      "Incorrect email or password.",
      "error"
    );

  }

}


/* =========================================
   CHECK EXISTING BACKEND SESSION
   ========================================= */

async function restoreBackendSession() {

  try {

    const data =
      await apiRequest("/api/me");


    if (
      data &&
      data.user
    ) {

      console.log(
        "Existing Virexa session restored."
      );

      showDashboard(data.user);

    }

  } catch (error) {

    /*
      No active session.
      This is normal when visiting
      the website for the first time.
    */

    console.log(
      "No active Virexa session."
    );

  }

}


/* =========================================
   INITIALISE VIREXA
   ========================================= */

function initializeVirexa() {

  console.log(
    "Virexa Markets client system loaded."
  );


  /* SIGNUP */

  const signupForm =
    document.getElementById("signupForm");


  if (signupForm) {

    signupForm.addEventListener(
      "submit",
      handleSignup
    );

  } else {

    console.warn(
      "signupForm was not found."
    );

  }


  /* LOGIN */

  const loginForm =
    document.getElementById("loginForm");


  if (loginForm) {

    loginForm.addEventListener(
      "submit",
      handleLogin
    );

  } else {

    console.warn(
      "loginForm was not found."
    );

  }


  /* MODAL BACKGROUND CLICK */

  document.addEventListener(
    "click",
    function(event) {

      if (
        event.target.classList &&
        event.target.classList.contains("modal")
      ) {

        event.target.classList.remove("show");

      }

    }
  );


  /* ESCAPE KEY */

  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {

        closeM();

      }

    }
  );


  /* CHECK BACKEND SESSION */

  restoreBackendSession();

}


/* =========================================
   START
   ========================================= */

if (
  document.readyState === "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    initializeVirexa
  );

} else {

  initializeVirexa();

}

</script>
