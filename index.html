<script>
/* =========================================
   VIREXA MARKETS — CLIENT SYSTEM
   DEVELOPMENT VERSION
   ========================================= */

const USERS_KEY = "virexa_users";
const SESSION_KEY = "virexa_session";


/* =========================================
   STORAGE
   ========================================= */

function getUsers() {
  try {
    return JSON.parse(
      localStorage.getItem(USERS_KEY) || "[]"
    );
  } catch (error) {
    console.error("Unable to read users:", error);
    return [];
  }
}


function saveUsers(users) {
  localStorage.setItem(
    USERS_KEY,
    JSON.stringify(users)
  );
}


function getSession() {
  try {
    return JSON.parse(
      localStorage.getItem(SESSION_KEY) || "null"
    );
  } catch (error) {
    return null;
  }
}


function saveSession(user) {
  localStorage.setItem(
    SESSION_KEY,
    JSON.stringify({
      id: user.id,
      name: user.name,
      email: user.email
    })
  );
}


function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}


/* =========================================
   MODALS
   ========================================= */

function openM(type) {

  const modal = document.getElementById(type);

  if (!modal) {
    console.error("Modal not found:", type);
    return;
  }

  modal.classList.add("show");
}


function closeM(type) {

  if (type) {

    const modal = document.getElementById(type);

    if (modal) {
      modal.classList.remove("show");
    }

    return;
  }

  const login = document.getElementById("login");
  const signup = document.getElementById("signup");

  if (login) {
    login.classList.remove("show");
  }

  if (signup) {
    signup.classList.remove("show");
  }
}


/* =========================================
   FORM MESSAGES
   ========================================= */

function showMessage(id, message, type) {

  const element = document.getElementById(id);

  if (!element) return;

  element.textContent = message;

  element.className =
    "formMessage " + type;
}


/* =========================================
   DASHBOARD
   ========================================= */

function showDashboard(user) {

  const publicSite =
    document.getElementById("publicSite");

  const siteHeader =
    document.getElementById("siteHeader");

  const siteFooter =
    document.getElementById("siteFooter");

  const dashboard =
    document.getElementById("clientDashboard");


  if (publicSite) {
    publicSite.style.display = "none";
  }

  if (siteHeader) {
    siteHeader.style.display = "none";
  }

  if (siteFooter) {
    siteFooter.style.display = "none";
  }

  if (dashboard) {
    dashboard.style.display = "block";
  }


  const dashName =
    document.getElementById("dashName");

  const dashEmail =
    document.getElementById("dashEmail");

  const dashId =
    document.getElementById("dashId");

  const dashBalance =
    document.getElementById("dashBalance");

  const dashEquity =
    document.getElementById("dashEquity");

  const dashCreated =
    document.getElementById("dashCreated");


  if (dashName) {
    dashName.textContent =
      user.name || "Client";
  }


  if (dashEmail) {
    dashEmail.textContent =
      user.email || "—";
  }


  if (dashId) {
    dashId.textContent =
      user.id || "VX-000000";
  }


  if (dashBalance) {
    dashBalance.textContent =
      "$" +
      Number(user.balance || 0).toFixed(2);
  }


  if (dashEquity) {
    dashEquity.textContent =
      "$" +
      Number(user.equity || 0).toFixed(2);
  }


  if (dashCreated) {

    if (user.createdAt) {

      dashCreated.textContent =
        new Date(
          user.createdAt
        ).toLocaleDateString();

    } else {

      dashCreated.textContent = "—";

    }
  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================
   RETURN TO PUBLIC WEBSITE
   ========================================= */

function returnToWebsite() {

  const publicSite =
    document.getElementById("publicSite");

  const siteHeader =
    document.getElementById("siteHeader");

  const siteFooter =
    document.getElementById("siteFooter");

  const dashboard =
    document.getElementById("clientDashboard");


  if (dashboard) {
    dashboard.style.display = "none";
  }

  if (publicSite) {
    publicSite.style.display = "block";
  }

  if (siteHeader) {
    siteHeader.style.display = "block";
  }

  if (siteFooter) {
    siteFooter.style.display = "block";
  }
}


/* =========================================
   LOGOUT
   ========================================= */

function logout() {

  clearSession();

  returnToWebsite();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================
   SECURITY
   ========================================= */

function showSecurity() {

  alert(
    "Virexa Markets security is currently running in development mode. Production authentication will use secure server-side authentication."
  );
}


/* =========================================
   SIGNUP
   ========================================= */

function handleSignup(event) {

  event.preventDefault();


  const nameElement =
    document.getElementById("signupName");

  const emailElement =
    document.getElementById("signupEmail");

  const passwordElement =
    document.getElementById("signupPassword");

  const confirmElement =
    document.getElementById("signupConfirm");


  if (
    !nameElement ||
    !emailElement ||
    !passwordElement
  ) {

    console.error(
      "Signup form fields are missing."
    );

    alert(
      "Signup system could not find the required fields."
    );

    return;
  }


  const name =
    nameElement.value.trim();

  const email =
    emailElement.value
      .trim()
      .toLowerCase();

  const password =
    passwordElement.value;

  const confirm =
    confirmElement
      ? confirmElement.value
      : password;


  if (name.length < 2) {

    showMessage(
      "signupMessage",
      "Please enter your full name.",
      "error"
    );

    return;
  }


  if (!email) {

    showMessage(
      "signupMessage",
      "Please enter your email address.",
      "error"
    );

    return;
  }


  if (password.length < 10) {

    showMessage(
      "signupMessage",
      "Password must contain at least 10 characters.",
      "error"
    );

    return;
  }


  if (password !== confirm) {

    showMessage(
      "signupMessage",
      "Passwords do not match.",
      "error"
    );

    return;
  }


  const users = getUsers();


  const existingUser =
    users.find(
      user =>
        user.email === email
    );


  if (existingUser) {

    showMessage(
      "signupMessage",
      "An account with this email already exists.",
      "error"
    );

    return;
  }


  const user = {

    id:
      "VX-" +
      Date.now()
        .toString()
        .slice(-8),

    name: name,

    email: email,

    password: password,

    balance: 0,

    equity: 0,

    createdAt:
      new Date().toISOString()

  };


  users.push(user);

  saveUsers(users);

  saveSession(user);


  showMessage(
    "signupMessage",
    "Account created successfully! Opening dashboard...",
    "success"
  );


  setTimeout(
    function() {

      closeM("signup");

      showDashboard(user);

    },
    700
  );
}


/* =========================================
   LOGIN
   ========================================= */

function handleLogin(event) {

  event.preventDefault();


  const emailElement =
    document.getElementById("loginEmail");

  const passwordElement =
    document.getElementById("loginPassword");


  if (
    !emailElement ||
    !passwordElement
  ) {

    alert(
      "Login system could not find the required fields."
    );

    return;
  }


  const email =
    emailElement.value
      .trim()
      .toLowerCase();

  const password =
    passwordElement.value;


  const users = getUsers();


  const user =
    users.find(
      item =>
        item.email === email &&
        item.password === password
    );


  if (!user) {

    showMessage(
      "loginMessage",
      "Incorrect email or password.",
      "error"
    );

    return;
  }


  saveSession(user);


  showMessage(
    "loginMessage",
    "Login successful! Opening dashboard...",
    "success"
  );


  setTimeout(
    function() {

      closeM("login");

      showDashboard(user);

    },
    500
  );
}


/* =========================================
   INITIALISE SYSTEM
   ========================================= */

function initializeVirexa() {

  console.log(
    "Virexa Markets client system loaded."
  );


  /* SIGNUP FORM */

  const signupForm =
    document.getElementById("signupForm");


  if (signupForm) {

    signupForm.addEventListener(
      "submit",
      handleSignup
    );

  }


  /* LOGIN FORM */

  const loginForm =
    document.getElementById("loginForm");


  if (loginForm) {

    loginForm.addEventListener(
      "submit",
      handleLogin
    );

  }


  /* CLOSE MODAL WHEN BACKGROUND IS CLICKED */

  document.addEventListener(
    "click",
    function(event) {

      if (
        event.target.classList &&
        event.target.classList.contains("modal")
      ) {

        event.target.classList.remove("show");

      }

    }
  );


  /* ESCAPE KEY */

  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {

        closeM();

      }

    }
  );


  /* RESTORE SESSION */

  const session =
    getSession();


  if (session) {

    const users =
      getUsers();


    const user =
      users.find(
        item =>
          item.id === session.id
      );


    if (user) {

      showDashboard(user);

    } else {

      clearSession();

    }

  }

}


/* =========================================
   START
   ========================================= */

if (
  document.readyState === "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    initializeVirexa
  );

} else {

  initializeVirexa();

}

</script>
